name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # reused by the release workflow

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go vet ./...
      - run: npm ci
      - run: npm test
      - name: Test again with the race detector
        if: runner.os == 'Linux'
        run: npm test
        env:
          MVRS_RACE: "1"

name: release

# Push a tag like v0.2.0: runs the tests on all systems, builds the executables and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          build() { # GOOS GOARCH output
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/$3" .
          }
          build windows amd64 multiviewer-replay-sync-windows-x64.exe
          build windows arm64 multiviewer-replay-sync-windows-arm64.exe
          # macOS and Linux files are archived only so the executable permission survives the download
          for target in darwin/arm64/macos-arm64 darwin/amd64/macos-x64 linux/amd64/linux-x64 linux/arm64/linux-arm64; do
            IFS=/ read -r os arch name <<< "$target"
            build "$os" "$arch" multiviewer-replay-sync
            if [ "$os" = darwin ]; then (cd dist && zip -q "multiviewer-replay-sync-$name.zip" multiviewer-replay-sync)
            else tar czf "dist/multiviewer-replay-sync-$name.tar.gz" -C dist multiviewer-replay-sync; fi
            rm dist/multiviewer-replay-sync
          done
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          | System | File | How to start |
          |---|---|---|
          | Windows | `multiviewer-replay-sync-windows-x64.exe` | Double-click. If *"Windows protected your PC"* appears: **More info → Run anyway** (first time only). |
          | macOS | `…-macos-arm64.zip` (Apple Silicon) or `…-macos-x64.zip` (Intel) | Unzip, double-click. If macOS blocks it: **System Settings → Privacy & Security → Open Anyway** (first time only). |
          | Linux | `…-linux-x64.tar.gz` or `…-linux-arm64.tar.gz` | `tar xzf` it, then run `./multiviewer-replay-sync` in a terminal. |

          One small file, no install needed. The warnings appear because the files aren't code-signed.
          Everyone still needs MultiViewer and their own F1 TV account. See the [README](https://github.com/${{ github.repository }}#readme) for how to host and join.

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
